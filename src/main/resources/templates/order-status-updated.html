<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estado de tu orden actualizado</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; color: #333;">
<h2 style="color: #2196F3;">🔄 El estado de tu orden fue actualizado</h2>
<p>Tu orden ha cambiado de estado. Consulta el detalle a continuación:</p>
<table style="border-collapse: collapse; width: 100%;">
    <tr style="background-color: #f2f2f2;">
        <th style="padding: 8px; border: 1px solid #ddd;">Orden #</th>
        <th style="padding: 8px; border: 1px solid #ddd;">Nuevo Estado</th>
        <th style="padding: 8px; border: 1px solid #ddd;">Fecha de actualización</th>
    </tr>
    <tr>
        <td style="padding: 8px; border: 1px solid #ddd; text-align:center;">${orderId}</td>
        <td style="padding: 8px; border: 1px solid #ddd; text-align:center;">${status}</td>
        <td style="padding: 8px; border: 1px solid #ddd; text-align:center;">${updatedAt}</td>
    </tr>
</table>
<br/>
<p style="color: #888; font-size: 12px;">Este es un correo automático, por favor no respondas.</p>
</body>
</html>
